[build-system]
build-backend = 'mesonpy'
requires = ['meson-python', 'numpy', 'cython']


[project]
name = 'satsmooth'
description = "Dynamic temporal smoothing of satellite time series"
readme = 'README.md'
license = {file = "LICENSE.txt"}
version = "1.5.16"

authors = [{name='Jordan Graesser'}]
maintainers = [
  {name = 'Jordan Graesser'}
]
dependencies = [
  'numpy',
  'pandas'
]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.vscode
  | \.idea
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

